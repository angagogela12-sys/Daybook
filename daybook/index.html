<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="theme-color" content="#C4285F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-first single column with a bottom tab bar; at 900px+ the tabs become a left rail and Today/Insights split into two columns. */
:root{
  --bg:#F7F2F5;--surface:#FFFFFF;--surface2:#FAF5F8;--ink:#241A28;--mute:#6F6176;--line:#EADFE7;--track:#EFE6EC;
  --accent:#C42B66;--on-accent:#FFFFFF;--accent-soft:#F9E3EC;
  --over:#B4501B;--good:#2A8559;
  --p:#3D6FD6;--c:#B07210;--f:#D4544D;--fi:#2A8559;--water:#1B8F9D;
  --shadow:0 1px 2px rgba(36,26,40,.05),0 10px 26px -16px rgba(36,26,40,.28);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#130E15;--surface:#1E1722;--surface2:#261E2B;--ink:#F6EEF3;--mute:#B09FB7;--line:#34293B;--track:#2E2433;
  --accent:#FF6BA6;--on-accent:#2B0B19;--accent-soft:#3A1B2C;
  --over:#F08A55;--good:#5FCB93;
  --p:#7DA6FF;--c:#F0B04A;--f:#FF807A;--fi:#5FCB93;--water:#4FD0DD;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130E15;--surface:#1E1722;--surface2:#261E2B;--ink:#F6EEF3;--mute:#B09FB7;--line:#34293B;--track:#2E2433;
  --accent:#FF6BA6;--on-accent:#2B0B19;--accent-soft:#3A1B2C;
  --over:#F08A55;--good:#5FCB93;
  --p:#7DA6FF;--c:#F0B04A;--f:#FF807A;--fi:#5FCB93;--water:#4FD0DD;--shadow:none;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ic{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}
.disp{font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}

/* shell + nav */
.shell{max-width:1100px;margin:0 auto}
.app{padding:18px 0 120px;min-width:0}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nv{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px;padding:6px 8px;border-radius:14px;color:var(--mute);font-size:11px;font-weight:700}
.nv[aria-current="page"]{color:var(--accent)}
.nv.add{background:var(--accent);color:var(--on-accent);width:54px;height:54px;min-width:0;border-radius:18px;justify-content:center;margin-top:-20px;box-shadow:0 10px 22px -10px var(--accent)}
.nv.add span{display:none}

/* header */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.head h1{font-family:'Fraunces',Georgia,serif;font-size:32px;line-height:1.1;letter-spacing:-.015em}
.head p{color:var(--mute);margin-top:4px;font-weight:500}
.hactions{display:flex;gap:8px;align-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.roundbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none}
.weekbar{display:flex;align-items:center;gap:6px;margin:16px 0 18px}
.weekstrip{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;min-width:0}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:14px;border:1px solid transparent;min-height:58px;position:relative}
.day .dw{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.day .dn{font-size:16px;font-weight:700}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.day.has .dot{background:var(--accent)}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--accent);color:var(--on-accent)}
.day.sel .dw,.day.sel .dn{color:var(--on-accent)}
.day.sel.has .dot{background:var(--on-accent)}

/* views + cards */
.view{display:none}
.view.on{display:block}
.cols{display:grid;gap:14px;align-items:start}
.col{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{font-family:'Fraunces',Georgia,serif;font-size:19px;letter-spacing:-.01em}
.ch .sub{color:var(--mute);font-size:13px;font-weight:500}
.link{color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.cta{display:inline-flex;align-items:center;gap:8px}

/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px}
.left{font-size:52px;line-height:1}
.leftlbl{color:var(--mute);font-weight:500;margin-top:6px}
.ringwrap{position:relative;width:112px;height:112px;flex:none}
.ringwrap .ic{position:absolute;inset:0;margin:auto;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.stat .l{color:var(--mute);font-size:12px;font-weight:500}
.stat .v{font-weight:700;font-size:17px;margin-top:1px;overflow-wrap:anywhere}
.macros{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px}
.mac .t{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:500;gap:6px}
.mac .t b{color:var(--ink);font-weight:700}
.bar{height:7px;border-radius:4px;background:var(--track);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* lists */
.group{margin-top:12px}
.group:first-of-type{margin-top:0}
.gh{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 0;border-bottom:1px solid var(--line);min-height:52px;text-align:left}
.group .item:last-child,.item.last{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .nm{font-weight:500;overflow-wrap:anywhere}
.item .meta{color:var(--mute);font-size:13px;margin-top:1px}
.item .val{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item .chev{color:var(--mute)}

/* buttons, chips, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.block{width:100%}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--over);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.55;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.seg{display:flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto}
.segbtn{flex:1;min-height:38px;padding:0 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--mute);text-align:center;white-space:nowrap}
.segbtn.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:grid;gap:6px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--mute)}
input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-width:0}
textarea{min-height:240px;resize:vertical;line-height:1.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stack{display:grid;gap:12px}
.status{color:var(--mute);font-size:13px}
.hr{height:1px;background:var(--line);margin:4px 0}
.circle{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--on-accent)}
.circle.on{background:var(--good);border-color:var(--good)}
.step{display:inline-flex;align-items:center;gap:6px}
.step .btn{min-height:36px;width:36px;padding:0;border-radius:12px}
.dots{display:flex;gap:5px;margin-top:8px}
.dots i{width:18px;height:18px;border-radius:6px;background:var(--track);display:block}
.dots i.met{background:var(--good)}
.dots i.fut{opacity:.45}
.dots i.now{outline:2px solid var(--ink);outline-offset:1px}
.streak{display:inline-flex;align-items:center;gap:3px;color:var(--over);font-weight:700;font-size:13px}

/* insights */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .l{color:var(--mute);font-size:12px;font-weight:500}
.tile .v{font-size:22px;margin-top:2px}
.tile .s{color:var(--mute);font-size:12px;margin-top:2px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-family:'DM Sans',system-ui,sans-serif}
.hbar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.hbar .bar{margin-top:0;height:10px}
.review p{margin-top:10px;line-height:1.6}
.legend{display:flex;gap:12px;align-items:center;color:var(--mute);font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* money */
.big{font-size:44px;line-height:1.05}
.bad{color:var(--over)}
.good{color:var(--good)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(14,6,16,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s ease;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.scrim.open{opacity:1}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(28px);transition:transform .2s ease}
.scrim.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.shead h2{font-family:'Fraunces',Georgia,serif;font-size:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-weight:500;max-width:calc(100vw - 32px)}
.toast button{color:var(--accent);font-weight:700;padding:4px 8px;filter:brightness(1.35)}

@media (min-width:900px){
  .shell{display:grid;grid-template-columns:92px minmax(0,1fr);gap:30px;align-items:start}
  .nav{position:sticky;top:18px;left:auto;right:auto;bottom:auto;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:6px;border:1px solid var(--line);border-radius:24px;padding:12px 8px;margin-top:18px;box-shadow:var(--shadow)}
  .nv{min-width:0}
  .nv.add{order:-1;width:100%;margin:0 0 8px;height:52px}
  .app{padding-bottom:56px}
  .cols{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .scrim{align-items:center}
  .sheet{border-radius:26px;max-height:86vh}
  .toast{bottom:28px}
  .wide2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{transition:none}}
.lockscreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.lockbox{width:100%;max-width:380px;text-align:center}
.lockbox h2{margin-bottom:6px}
.lockbox .stack{text-align:left}
.lockicon{width:64px;height:64px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;letter-spacing:.05em;text-align:center;padding:16px 10px;border:1px dashed var(--line);border-radius:14px;background:var(--surface2);user-select:all;word-break:break-all;font-weight:700}
.val.good{color:var(--good)}
input[type=password]{width:100%;min-height:46px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);min-width:0}
.seg{flex-wrap:wrap}.seg .segbtn{flex:1 1 auto}
</style>

  </svg>

<div class="shell" id="shell">
  <nav class="nav" id="nav" aria-label="Main">
    <button type="button" class="nv" data-view="today"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-home"/></svg><span>Today</span></button>
    <button type="button" class="nv" data-view="insights"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-chart"/></svg><span>Insights</span></button>
    <button type="button" class="nv add" id="navAdd" aria-label="Add an entry"><svg class="ic" width="26" height="26" aria-hidden="true"><use href="#i-plus"/></svg><span>Add</span></button>
    <button type="button" class="nv" data-view="money"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-wallet"/></svg><span>Money</span></button>
    <button type="button" class="nv" data-view="life"><svg class="ic" width="22" height="22" aria-hidden="true"><use href="#i-life"/></svg><span>Life</span></button>
  </nav>

  <main class="app">
    <header class="head">
      <div><h1 id="title"></h1><p id="subtitle"></p></div>
      <div class="hactions">
        <button type="button" id="weightChip" class="pill"></button>
        <button type="button" id="lockBtn" class="roundbtn" aria-label="Lock Daybook" hidden><svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-lock"/></svg></button>
        <button type="button" id="settingsBtn" class="roundbtn" aria-label="Settings"><svg class="ic" width="20" height="20" aria-hidden="true"><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <div class="weekbar" id="weekbar">
      <button type="button" id="wprev" class="roundbtn" aria-label="Previous week"><svg class="ic" width="18" height="18" aria-hidden="true"><use href="#i-left"/></svg></button>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var MEALS=['Breakfast','Lunch','Dinner','Snack'];

var LS='calorie-tracker-v1',LS_THEME='daybook-theme';
var DEFAULT_HABITS=[
  {id:'reading',name:'Reading',kind:'min',target:20},
  {id:'devotion',name:'Devotion',kind:'min',target:10},
  {id:'study',name:'CAD / design study',kind:'min',target:30},

];

var STARTER_TASKS=[
  ['CAD certification','Pick the CAD certification to aim for'],
  ['CAD certification','Book the exam date'],
  ['CAD certification','Do a 30 minute practice session'],
  ['Portfolio','Choose three projects to feature'],
  ['Portfolio','Write a case study for the first project'],
  ['Portfolio','Publish the portfolio site'],
  ['Job search','Shortlist 10 design roles to apply for']
];

function clone(x){return JSON.parse(JSON.stringify(x));}
function defaultState(){return{goal:1750,weight:null,targetWeight:null,waterGoal:2000,jobs:[],budgets:{},plan:DEFAULT_PLAN.slice(),habits:clone(DEFAULT_HABITS),tasks:[],nudgeOn:true,nudgeHour:20,days:{}};}
var state=defaultState();
function mergeSettings(p){
  if(!p||typeof p!=='object')return;
  if(typeof p.goal==='number')state.goal=p.goal;
  if(typeof p.weight==='number'||p.weight===null)state.weight=p.weight;
  if(typeof p.targetWeight==='number'||p.targetWeight===null)state.targetWeight=p.targetWeight;
  if(typeof p.waterGoal==='number')state.waterGoal=p.waterGoal;
  if(Array.isArray(p.jobs))state.jobs=p.jobs;
  if(p.budgets&&typeof p.budgets==='object')state.budgets=p.budgets;
  if(Array.isArray(p.plan)&&p.plan.length===7)state.plan=p.plan;
  if(Array.isArray(p.habits)&&p.habits.length)state.habits=p.habits;
  if(Array.isArray(p.tasks))state.tasks=p.tasks;

  if(typeof p.nudgeHour==='number')state.nudgeHour=p.nudgeHour;
}
/* ---------- security core: passcode lock and encryption ---------- */
var LS_LOCK='daybook-lock',LS_TRIES='daybook-lock-tries',KDF_ITER=250000;
var cryptoOK=!!(window.crypto&&window.crypto.subtle&&window.TextEncoder&&window.atob);
var te=cryptoOK?new TextEncoder():null,td=cryptoOK?new TextDecoder():null;
var lockMeta=null,dek=null,unlocked=true,lastActive=Date.now(),hiddenAt=0,pendingFlush=null,metaDirty=false;
var dbNS=null,dbReady=false,settingsRef=null,daysCol=null,dlNS=null;

function readMeta(){try{var m=localStorage.getItem(LS_LOCK);return m?JSON.parse(m):null;}catch(e){return null;}}
function writeMeta(){try{if(lockMeta)localStorage.setItem(LS_LOCK,JSON.stringify(lockMeta));else localStorage.removeItem(LS_LOCK);}catch(e){}}
function b64(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function unb64(s){var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function deriveKey(secret,salt,iter){
  var base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function aesEnc(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes);return{iv:b64(iv),ct:b64(ct)};}
async function aesDec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct)));}
async function sealJson(obj,key){var e=await aesEnc(key,te.encode(JSON.stringify(obj)));return{v:1,iv:e.iv,ct:e.ct};}
async function openJson(doc,key){return JSON.parse(td.decode(await aesDec(key,doc)));}
function isSealed(d){return !!(d&&typeof d.ct==='string'&&typeof d.iv==='string');}
async function wrapWith(secret,rawKey){
  var salt=crypto.getRandomValues(new Uint8Array(16)),kek=await deriveKey(secret,salt,KDF_ITER),w=await aesEnc(kek,rawKey);
  return{salt:b64(salt),iter:KDF_ITER,iv:w.iv,ct:w.ct};
}
async function unwrapWith(secret,w){return aesDec(await deriveKey(secret,unb64(w.salt),w.iter),{iv:w.iv,ct:w.ct});}
function importDek(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);}
function newRecoveryCode(){
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(16)),s='';
  for(var i=0;i<16;i++){s+=A[b[i]%32];if(i%4===3&&i<15)s+='-';}
  return s;
}
function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}

/* wrong-guess delay: a courtesy against casual guessing; the key-stretching above is the real guard */
function getTries(){try{return JSON.parse(localStorage.getItem(LS_TRIES))||{n:0,until:0};}catch(e){return{n:0,until:0};}}
function setTries(t){try{localStorage.setItem(LS_TRIES,JSON.stringify(t));}catch(e){}}
function failedAttempt(){var t=getTries();t.n++;if(t.n>=5)t.until=Date.now()+Math.min(30000*Math.pow(2,t.n-5),900000);setTries(t);}
function clearTries(){setTries({n:0,until:0});}
function waitLeft(){return Math.max(0,Math.ceil((getTries().until-Date.now())/1000));}

lockMeta=readMeta();
if(lockMeta)unlocked=false;
else{try{var rawLocal=localStorage.getItem(LS);if(rawLocal){var lp=JSON.parse(rawLocal);if(lp&&!lp.enc)applyLoaded(lp);}}catch(e){}}
function applyLoaded(p){mergeSettings(p);if(p&&p.days&&typeof p.days==='object')state.days=p.days;}

/* ---------- storage: local cache + per-user database, sealed when the lock is on ---------- */
function settingsPayload(){return{goal:state.goal,weight:state.weight,targetWeight:state.targetWeight,waterGoal:state.waterGoal,jobs:state.jobs||[],budgets:state.budgets||{},plan:state.plan,habits:state.habits,tasks:state.tasks||[],nudgeOn:state.nudgeOn,nudgeHour:state.nudgeHour};}
var saving=false,saveAgain=false;
function save(){
  if(!unlocked)return;
  if(saving){saveAgain=true;return;}
  saving=true;
  doSave().catch(function(){}).then(function(){saving=false;if(saveAgain){saveAgain=false;save();}});
}
async function doSave(){
  try{
    if(lockMeta){
      if(!dek)return;
      var snap=await sealJson(state,dek);
      localStorage.setItem(LS,JSON.stringify(Object.assign({enc:1},snap)));
    }else localStorage.setItem(LS,JSON.stringify(state));
  }catch(e){}
}
function whenSaved(){return new Promise(function(res){(function chk(){if(!saving&&!saveAgain)res();else setTimeout(chk,20);})();});}
function writeDay(k){
  if(!dbReady)return;
  var d=state.days[k];if(d===undefined)return;
  var key_=dek,sealed=!!lockMeta;
  if(sealed&&!key_)return;
  var p=sealed?sealJson(d,key_):Promise.resolve(clone(d));
  p.then(function(doc){return daysCol.doc(k).set(doc);}).catch(function(){});
}
function writeSettings(){
  if(!dbReady)return;
  var payload=settingsPayload();
  if(lockMeta){
    if(!dek)return;
    sealJson(payload,dek).then(function(doc){return settingsRef.set(Object.assign({lock:lockMeta},doc));}).catch(function(){});
  }else settingsRef.set(clone(payload)).catch(function(){});
}
function persistDay(k){if(!unlocked)return;save();writeDay(k);}
function persistSettings(){if(!unlocked)return;save();writeSettings();}
async function syncDay(k){
  if(!dbReady||!unlocked)return;
  try{
    var snap=await daysCol.doc(k).get();
    if(snap.exists){var dd=snap.data();state.days[k]=isSealed(dd)?await openJson(dd,dek):clone(dd);save();renderAll();}
  }catch(e){}
}

/* ---------- small helpers ---------- */
function $(x){return document.getElementById(x);}
function pad2(n){return String(n).padStart(2,'0');}
function key(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2],12);}
function addDays(d,n){var e=new Date(d);e.setDate(e.getDate()+n);e.setHours(12,0,0,0);return e;}

function isBiz(m){return m.biz!==undefined?m.biz===true:(m.cat==='Business'||m.cat==='Business income');}
function shortDate(d){return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.appendChild(typeof c==='object'?c:document.createTextNode(String(c)));
}
function h(tag,props){
  var e=document.createElement(tag),val;
  props=props||{};
  Object.keys(props).forEach(function(k){
    var v=props[k];
    if(v==null||v===false)return;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='value')val=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='required'||k==='disabled'||k==='hidden')e[k]=true;
    else e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  if(val!==undefined)e.value=val;
  return e;
}
function sv(tag,attrs,text){
  var e=document.createElementNS(NS,tag);
  Object.keys(attrs||{}).forEach(function(k){e.setAttribute(k,attrs[k]);});
  if(text!=null)e.textContent=text;

}

}
function field(label,input){return h('label',{class:'field'},h('span',{text:label}),input);}
function fieldDiv(label,content){return h('div',{class:'field'},h('span',{text:label}),content);}
function numIn(ph,val,step){return h('input',{type:'number',inputmode:step?'decimal':'numeric',min:'0',step:step||'1',placeholder:ph||'0',value:(val===0||val)?val:''});}
function emptyP(t){return h('p',{class:'empty',text:t});}

/* ---------- day data ---------- */
var cur=new Date();cur.setHours(12,0,0,0);
var bMonth=new Date(cur.getFullYear(),cur.getMonth(),1,12);
var view='today',lifeTab='habits',insRange=7,addTab='food',mealSel='Lunch',moneyScope='all',taskArea='CAD certification';
var sampleNS=null,sampleImages=false;

function dayData(k){
  var d=state.days[k];
  if(Array.isArray(d))d={food:d};
  d=Object.assign({},d||{});
  d.food=d.food||[];d.activities=d.activities||[];d.money=d.money||[];
  d.checks=Object.assign({},d.checks);
  d.water=d.water||0;d.reading=d.reading||0;d.devotion=d.devotion||0;d.study=d.study||0;
  d.weight=d.weight||null;d.mood=d.mood||0;d.wakeTime=d.wakeTime||'';d.journal=d.journal||'';
  return d;
}
function commit(k,d){state.days[k]=d;persistDay(k);renderAll();}
function totals(day){
  return{eaten:sum(day.food,function(e){return e.kcal;}),burned:sum(day.activities,function(e){return e.kcal;}),
    protein:sum(day.food,function(e){return e.protein;}),carbs:sum(day.food,function(e){return e.carbs;}),
    fat:sum(day.food,function(e){return e.fat;}),fiber:sum(day.food,function(e){return e.fiber;})};
}
function daySpent(day){return sum(day.money,function(m){return isIncome(m.cat)?0:m.amt;});}
function hasLog(day){return day.food.length||day.activities.length||day.water||day.money.length||day.journal||day.weight;}

/* habits */
function habitVal(day,hb){return BUILTIN.indexOf(hb.id)!==-1?(day[hb.id]||0):(day.checks[hb.id]||0);}
function setHabit(day,hb,v){if(BUILTIN.indexOf(hb.id)!==-1)day[hb.id]=v;else day.checks[hb.id]=v;}
function habitMet(day,hb){return habitVal(day,hb)>=Math.max(1,hb.target||1);}
function streak(hb){
  var n=0,d=new Date();d.setHours(12,0,0,0);
  for(var i=0;i<400;i++){
    if(habitMet(dayData(key(d)),hb))n++;else if(i>0)break;
    d=addDays(d,-1);
  }
  return n;
}
function latestWeight(){
  var ks=Object.keys(state.days).filter(function(k){return dayData(k).weight;}).sort();
  return ks.length?{k:ks[ks.length-1],w:dayData(ks[ks.length-1]).weight}:null;
}
function recents(kind){
  var map={},d=new Date();d.setHours(12,0,0,0);
  for(var i=0;i<60;i++){
    var day=dayData(key(d));
    day[kind].forEach(function(it){
      var n=String(it.name||'').toLowerCase();if(!n)return;
      if(!map[n])map[n]={count:0,item:it};
      map[n].count++;
    });
    d=addDays(d,-1);
  }
  return Object.keys(map).map(function(n){return map[n];}).sort(function(a,b){return b.count-a.count;}).slice(0,8).map(function(x){return x.item;});
}

/* ---------- toast + sheet ---------- */
var toastTimer=null;
function toast(msg,undo){
  var t=$('toast');t.innerHTML='';t.hidden=false;
  t.appendChild(h('span',{text:msg}));
  if(undo)t.appendChild(h('button',{type:'button',text:'Undo',onclick:function(){t.hidden=true;undo();}}));
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},5000);

var sheetOpen=false;
function openSheet(title,build){

  var body=$('sheetBody');body.innerHTML='';build(body);
  var w=$('sheetWrap');w.hidden=false;sheetOpen=true;document.body.classList.add('lock');
  requestAnimationFrame(function(){w.classList.add('open');});

$('sheetWrap').addEventListener('click',function(e){if(e.target===this)closeSheet();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetOpen)closeSheet();});

/* ---------- charts ---------- */
function niceMax(v,step){return Math.max(step,Math.ceil(v/step)*step);}
function calChart(days){
  var W=340,H=170,pl=38,pr=8,pt=14,pb=24,n=days.length;
  var budgetMax=Math.max.apply(null,days.map(function(d){return Math.max(d.eaten,d.budget);}).concat([state.goal,1]));
  var top=niceMax(budgetMax*1.1,500),ph=H-pt-pb,slot=(W-pl-pr)/n,bw=Math.min(slot*0.64,24);
  var s=sv('svg',{viewBox:'0 0 '+W+' '+H,'class':'chart',role:'img','aria-label':'Calories eaten each day compared with your daily goal'});
  [0,top/2,top].forEach(function(t){
    var y=pt+ph-(t/top)*ph;
    s.appendChild(sv('line',{x1:pl,x2:W-pr,y1:y,y2:y,style:'stroke:var(--line)','stroke-width':1}));
    s.appendChild(sv('text',{x:pl-6,y:y+3,'text-anchor':'end','font-size':9,style:'fill:var(--mute)'},fmt(t)));
  });
  days.forEach(function(d,i){
    var x=pl+i*slot+(slot-bw)/2,bh=Math.max(d.eaten>0?(d.eaten/top)*ph:2,2);
    s.appendChild(sv('rect',{x:x,y:pt+ph-bh,width:bw,height:bh,rx:4,style:'fill:'+(d.eaten>d.budget?'var(--over)':(d.eaten>0?'var(--accent)':'var(--track)'))}));
    var step=n<=7?1:Math.ceil(n/6);
    if(i%step===0)s.appendChild(sv('text',{x:x+bw/2,y:H-7,'text-anchor':'middle','font-size':9,style:'fill:var(--mute)'},n<=7?DOW[d.date.getDay()].slice(0,1)+' '+d.date.getDate():String(d.date.getDate())));
  });
  var gy=pt+ph-(state.goal/top)*ph;
  s.appendChild(sv('line',{x1:pl,x2:W-pr,y1:gy,y2:gy,'stroke-dasharray':'4 4','stroke-width':1.5,style:'stroke:var(--ink)',opacity:.55}));
  s.appendChild(sv('text',{x:W-pr,y:gy-4,'text-anchor':'end','font-size':9,'font-weight':700,style:'fill:var(--ink)'},'Goal '+fmt(state.goal)));
  return s;
}
function weightChart(pts){
  var W=340,H=170,pl=38,pr=10,pt=14,pb=24,ph=H-pt-pb,pw=W-pl-pr;
  var ws=pts.map(function(p){return p.w;});
  if(state.targetWeight)ws.push(state.targetWeight);
  var lo=Math.floor(Math.min.apply(null,ws)-0.5),hi=Math.ceil(Math.max.apply(null,ws)+0.5);
  if(hi-lo<2){hi+=1;lo-=1;}
  var t0=pts[0].date.getTime(),t1=pts[pts.length-1].date.getTime(),span=Math.max(t1-t0,1);
  function X(p){return pl+((p.date.getTime()-t0)/span)*pw;}
  function Y(w){return pt+ph-((w-lo)/(hi-lo))*ph;}
  var s=sv('svg',{viewBox:'0 0 '+W+' '+H,'class':'chart',role:'img','aria-label':'Body weight over time'});
  [lo,(lo+hi)/2,hi].forEach(function(v){
    var y=Y(v);
    s.appendChild(sv('line',{x1:pl,x2:W-pr,y1:y,y2:y,style:'stroke:var(--line)','stroke-width':1}));
    s.appendChild(sv('text',{x:pl-6,y:y+3,'text-anchor':'end','font-size':9,style:'fill:var(--mute)'},(Math.round(v*10)/10)+''));
  });
  if(state.targetWeight){
    var ty=Y(state.targetWeight);
    s.appendChild(sv('line',{x1:pl,x2:W-pr,y1:ty,y2:ty,'stroke-dasharray':'4 4','stroke-width':1.5,style:'stroke:var(--good)'}));
    s.appendChild(sv('text',{x:W-pr,y:ty-4,'text-anchor':'end','font-size':9,'font-weight':700,style:'fill:var(--good)'},'Target '+state.targetWeight));
  }
  var d=pts.map(function(p,i){return (i?'L':'M')+X(p).toFixed(1)+' '+Y(p.w).toFixed(1);}).join(' ');
  s.appendChild(sv('path',{d:d,fill:'none','stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round',style:'stroke:var(--accent)'}));
  pts.forEach(function(p,i){s.appendChild(sv('circle',{cx:X(p),cy:Y(p.w),r:i===pts.length-1?4.5:2.5,style:'fill:var(--accent)'}));});
  s.appendChild(sv('text',{x:pl,y:H-7,'text-anchor':'start','font-size':9,style:'fill:var(--mute)'},shortDate(pts[0].date)));
  s.appendChild(sv('text',{x:W-pr,y:H-7,'text-anchor':'end','font-size':9,style:'fill:var(--mute)'},shortDate(pts[pts.length-1].date)));
  return s;
}
function dayScore(day){
  var s=0;
  if(day.food.length)s++;
  if(day.activities.length)s++;
  if(state.waterGoal>0&&day.water>=state.waterGoal*0.75)s++;
  if(state.habits.some(function(hb){return habitMet(day,hb);}))s++;
  if(day.journal)s++;
  return s;
}
function heatmap(){
  var weeks=5,cs=18,gap=4,lw=14,W=lw+weeks*(cs+gap),H=7*(cs+gap);
  var s=sv('svg',{viewBox:'0 0 '+W+' '+H,'class':'chart',style:'max-width:'+(W*1.5)+'px',role:'img','aria-label':'Consistency over the last five weeks'});
  var start=addDays(weekStart(cur),-(weeks-1)*7),today=key(new Date());
  for(var r=0;r<7;r++){
    s.appendChild(sv('text',{x:0,y:r*(cs+gap)+cs-5,'font-size':9,style:'fill:var(--mute)'},DOW[r].slice(0,1)));
    for(var c=0;c<weeks;c++){
      var d=addDays(start,c*7+r),k=key(d),sc=dayScore(dayData(k)),future=k>today;
      s.appendChild(sv('rect',{x:lw+c*(cs+gap),y:r*(cs+gap),width:cs,height:cs,rx:5,style:'fill:'+(sc?'var(--accent)':'var(--track)'),'fill-opacity':future?0.35:(sc?0.2+sc*0.16:1)}));
    }
  }
  return s;

    box.appendChild(h('p',{class:'status',text:'Enter the recovery code you saved when you turned on app lock, then choose a new passcode.'}));
    box.appendChild(h('form',{class:'stack',style:'margin-top:16px;text-align:left',onsubmit:async function(ev){
      ev.preventDefault();
      var wl=waitLeft();if(wl>0){err.textContent='Too many tries. Wait '+wl+' seconds.';return;}
      if(n1.value.length<8){err.textContent='Use at least 8 characters for the new passcode.';return;}
      if(n1.value!==n2.value){err.textContent='The two passcodes do not match.';return;}
      go.disabled=true;err.textContent='Checking…';
      try{
        var raw=await unwrapWith(normCode(code.value),lockMeta.rec);
        dek=await importDek(raw);
        lockMeta.pin=await wrapWith(n1.value,raw);writeMeta();metaDirty=true;if(dbReady)settingsRef.update({lock:lockMeta}).then(function(){metaDirty=false;}).catch(function(){});
        await finishUnlock();
      }catch(e){dek=null;unlocked=false;failedAttempt();err.textContent='That recovery code did not work.';}
      finally{go.disabled=false;}
    }},field('Recovery code',code),field('New passcode',n1),field('Confirm new passcode',n2),go,err));
    box.appendChild(h('button',{type:'button',class:'link',style:'margin-top:6px',text:'Back',onclick:function(){renderLockBox('pass');}}));
    setTimeout(function(){code.focus();},60);
  }
}

/* auto-lock: after time away or idle */
['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){lastActive=Date.now();},{passive:true,capture:true});});
setInterval(function(){
  if(!lockMeta||!dek||!unlocked)return;
  var m=lockMeta.auto;
  if(m>0&&Date.now()-lastActive>m*60000)lockApp('Locked after '+m+(m===1?' minute':' minutes')+' of inactivity.');
},15000);
document.addEventListener('visibilitychange',function(){
  if(!lockMeta||!dek||!unlocked)return;
  if(document.hidden){hiddenAt=Date.now();if(lockMeta.auto===0)lockApp('Locked when you left Daybook.');}

/* ---------- SECURITY SETTINGS ---------- */
var AUTO_OPTIONS=[[0,'Right away'],[1,'1 minute'],[5,'5 minutes'],[15,'15 minutes'],[60,'1 hour']];
function autoLabel(n){var o=AUTO_OPTIONS.filter(function(x){return x[0]===n;})[0];return o?o[1]:n+' min';}
async function enableLock(pass){
  var key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);
  var raw=new Uint8Array(await crypto.subtle.exportKey('raw',key)),code=newRecoveryCode();
  lockMeta={v:1,pin:await wrapWith(pass,raw),rec:await wrapWith(normCode(code),raw),auto:5};
  dek=key;writeMeta();
  save();await whenSaved();writeSettings();Object.keys(state.days).forEach(writeDay);
  return code;
}
function copyText(t,btn){
  try{navigator.clipboard.writeText(t).then(function(){btn.textContent='Copied';},function(){btn.textContent='Select the code and copy it';});}
  catch(e){btn.textContent='Select the code and copy it';}
}
function openSecurity(){openSheet('Security and backup',function(body){renderSecurity(body);});}
function statRow(label,val,tone,last){return h('div',{class:'item'+(last?' last':''),style:'cursor:default;min-height:46px'},h('span',{class:'main nm',text:label}),h('span',{class:'val '+(tone||''),text:val}));}
function renderRecovery(body,code){
  body.innerHTML='';
  var ok=h('input',{type:'checkbox',id:'recSaved','aria-label':'I have saved my recovery code'});
  var done=h('button',{type:'button',class:'btn block',disabled:true,text:'Done',onclick:function(){renderSecurity(body);}});
  ok.addEventListener('change',function(){done.disabled=!ok.checked;});
  var copy=h('button',{type:'button',class:'btn ghost block',text:'Copy code'});
  copy.addEventListener('click',function(){copyText(code,copy);});
  body.appendChild(h('div',{class:'stack'},
    h('div',{class:'lockicon',style:'margin:0 auto'},ic('shield',28)),
    h('p',{style:'text-align:center;font-weight:700',text:'App lock is on'}),
    h('p',{class:'status',style:'text-align:center',text:'Your data is now encrypted. Save this recovery code somewhere safe, like a password manager. If you forget your passcode, it is the only way back in. It is shown once.'}),
    h('div',{class:'code',text:code}),copy,
    h('label',{style:'display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500'},ok,'I have saved my recovery code'),
    done));
}
function renderSecurity(body){
  body.innerHTML='';
  var st=h('div',{class:'stack'});body.appendChild(st);
  var on=!!lockMeta&&!!dek;
  if(!cryptoOK)st.appendChild(h('p',{class:'status',text:'This browser does not support the encryption Daybook uses, so app lock is unavailable here.'}));
  st.appendChild(h('div',{class:'card',style:'box-shadow:none;padding:4px 16px'},
    statRow('App lock',on?'On':'Off',on?'good':'',false),
    statRow('Saved data',on?'Encrypted':'Not encrypted',on?'good':'',!on),
    on?statRow('Locks',autoLabel(lockMeta.auto),'',true):null));

  if(!on&&cryptoOK){
    var p1=h('input',{type:'password',autocomplete:'new-password','aria-label':'New passcode',placeholder:'At least 8 characters'});
    var p2=h('input',{type:'password',autocomplete:'new-password','aria-label':'Confirm passcode',placeholder:'Repeat it'});
    var err=h('p',{class:'status',role:'alert'}),btn=h('button',{type:'submit',class:'btn block',text:'Turn on app lock'});
    st.appendChild(h('div',{class:'gh'},h('span',{text:'App lock'})));
    st.appendChild(h('p',{class:'status',text:'Daybook asks for a passcode when you open it and after you have been away. Your entries, money, weight and journal are encrypted with a key that your passcode protects, both on this device and in your account. Use 8 or more characters; longer is stronger.'}));
    st.appendChild(h('form',{class:'stack',onsubmit:async function(ev){
      ev.preventDefault();
      if(p1.value.length<8){err.textContent='Use at least 8 characters.';return;}
      if(p1.value!==p2.value){err.textContent='The two passcodes do not match.';return;}
      btn.disabled=true;err.textContent='Encrypting your data…';
      try{var code=await enableLock(p1.value);renderHeader();renderRecovery(body,code);}
      catch(e){lockMeta=null;dek=null;writeMeta();err.textContent='Could not turn on the lock. Nothing was changed.';btn.disabled=false;}
    }},field('Passcode',p1),field('Confirm passcode',p2),err,btn));
  }
  if(on){
    st.appendChild(h('button',{type:'button',class:'btn block',onclick:function(){closeSheet();setTimeout(function(){lockApp('Locked.');},200);}},ic('lock',18),'Lock now'));
    var seg=h('div',{class:'seg'});
    function drawSeg(){seg.innerHTML='';AUTO_OPTIONS.forEach(function(o){seg.appendChild(h('button',{type:'button',class:'segbtn'+(lockMeta.auto===o[0]?' on':''),text:o[1],onclick:function(){lockMeta.auto=o[0];writeMeta();persistSettings();drawSeg();}}));});}
    drawSeg();
    st.appendChild(fieldDiv('Lock after being away or idle for',seg));

    var cc=h('input',{type:'password',autocomplete:'current-password','aria-label':'Current passcode'}),cn=h('input',{type:'password',autocomplete:'new-password','aria-label':'New passcode',placeholder:'At least 8 characters'}),cn2=h('input',{type:'password',autocomplete:'new-password','aria-label':'Confirm new passcode'});
    var cerr=h('p',{class:'status',role:'alert'});
    st.appendChild(h('details',{class:'card',style:'box-shadow:none'},h('summary',{style:'cursor:pointer;font-weight:700;min-height:32px',text:'Change passcode'}),
      h('form',{class:'stack',style:'margin-top:12px',onsubmit:async function(ev){
        ev.preventDefault();
        if(cn.value.length<8){cerr.textContent='Use at least 8 characters.';return;}
        if(cn.value!==cn2.value){cerr.textContent='The new passcodes do not match.';return;}
        try{var raw=await unwrapWith(cc.value,lockMeta.pin);lockMeta.pin=await wrapWith(cn.value,raw);writeMeta();persistSettings();toast('Passcode changed');renderSecurity(body);}
        catch(e){cerr.textContent='The current passcode is wrong.';}
      }},field('Current passcode',cc),field('New passcode',cn),field('Confirm new passcode',cn2),cerr,h('button',{type:'submit',class:'btn block',text:'Change passcode'}))));

    st.appendChild(h('button',{type:'button',class:'btn ghost block',onclick:async function(){
      try{
        var raw=new Uint8Array(await crypto.subtle.exportKey('raw',dek)),code=newRecoveryCode();
        lockMeta.rec=await wrapWith(normCode(code),raw);writeMeta();persistSettings();renderRecovery(body,code);
      }catch(e){toast('Could not make a new recovery code');}
    }},'Make a new recovery code'));

    var off=h('input',{type:'password',autocomplete:'current-password','aria-label':'Passcode'}),oerr=h('p',{class:'status',role:'alert'});
    st.appendChild(h('details',{class:'card',style:'box-shadow:none'},h('summary',{style:'cursor:pointer;font-weight:700;min-height:32px;color:var(--over)',text:'Turn off app lock'}),
      h('form',{class:'stack',style:'margin-top:12px',onsubmit:async function(ev){
        ev.preventDefault();
        try{
          await unwrapWith(off.value,lockMeta.pin);
          lockMeta=null;dek=null;writeMeta();
          save();await whenSaved();writeSettings();Object.keys(state.days).forEach(writeDay);
          renderHeader();toast('App lock is off. Your data is no longer encrypted.');renderSecurity(body);
        }catch(e){oerr.textContent='That passcode is wrong.';}
      }},h('p',{class:'status',text:'Your data will be stored without encryption again. Enter your passcode to confirm.'}),field('Passcode',off),oerr,h('button',{type:'submit',class:'btn danger block',text:'Turn off app lock'}))));
  }

  /* backup + restore */
  st.appendChild(h('div',{class:'hr'}));
  st.appendChild(h('div',{class:'gh'},h('span',{text:'Backup'})));
  st.appendChild(h('p',{class:'status',text:on?'Backups are encrypted with your passcode, so keep your passcode and recovery code too.':'Backups are saved as a plain file. Turn on app lock first if you want them encrypted.'}));
  var bstat=h('p',{class:'status',role:'status'});
  var dl=h('button',{type:'button',class:'btn ghost block',text:'Download backup',onclick:async function(){
    try{
      var obj=await makeBackup(),fname='daybook-backup-'+key(new Date())+'.json';
      if(dlNS)await dlNS.save({filename:fname,data:JSON.stringify(obj)});
      else{var bl=new Blob([JSON.stringify(obj)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);}
      bstat.textContent='Backup saved.';
    }catch(e){bstat.textContent=(e&&e.code==='declined')?'':'Could not save the backup.';}
  }});
  var file=h('input',{type:'file',accept:'.json,application/json',hidden:true});
  file.addEventListener('change',function(){var f=file.files&&file.files[0];file.value='';if(f)readBackup(f,bstat,st);});
  st.appendChild(h('div',{class:'grid2'},dl,h('button',{type:'button',class:'btn ghost block',text:'Restore backup',onclick:function(){file.click();}}),file));
  st.appendChild(bstat);

  /* this device */
  st.appendChild(h('div',{class:'hr'}));
  st.appendChild(h('div',{class:'gh'},h('span',{text:'This device'})));
  var clr=h('button',{type:'button',class:'btn danger block',text:'Clear Daybook data from this device'});
  var armed=false;
  clr.addEventListener('click',function(){
    if(!armed){armed=true;clr.textContent='Tap again to clear. Your account copy stays.';return;}
    try{localStorage.removeItem(LS);}catch(e){}
    closeSheet();
    dbReady=false;remote=null;initDb();
    if(lockMeta){setTimeout(function(){lockApp('This device was cleared. Unlock to load your data again.');},200);}
    else{state=defaultState();renderAll();toast('Cleared. Reloading from your account.');}
  });
  st.appendChild(h('p',{class:'status',text:'Use this on a shared or borrowed device. It removes the saved copy from this browser only.'}));
  st.appendChild(clr);

  st.appendChild(h('div',{class:'hr'}));
  st.appendChild(h('p',{class:'status',text:'What this does not cover: anyone who knows your passcode, or who can use this page while it is unlocked, can read your log. The weekly review and quick log send what you ask them to Claude. Keep this page private; sharing the link does not share your data, but you should not share it.'}));
}
async function makeBackup(){
  var at=new Date().toISOString();
  if(lockMeta&&dek){var s=await sealJson(state,dek);return Object.assign({app:'daybook',v:1,at:at,sealed:true,lock:lockMeta},s);}
  return{app:'daybook',v:1,at:at,sealed:false,data:clone(state)};
}
function readBackup(f,bstat,st){
  if(f.size>20*1024*1024){bstat.textContent='That file is too large to be a Daybook backup.';return;}
  var r=new FileReader();
  function preview(obj,data){
    var days=data&&data.days&&typeof data.days==='object'?data.days:{};
    var keys=Object.keys(days).filter(function(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&days[k]&&typeof days[k]==='object';});
    bstat.textContent='';
    var box=h('div',{class:'card',style:'box-shadow:none'},
      h('p',{text:'Backup from '+new Date(obj.at||Date.now()).toLocaleDateString()+' with '+keys.length+' days of entries.'}),
      h('p',{class:'status',style:'margin:6px 0 12px',text:'Restoring adds these days and replaces any matching dates. Settings from the backup replace yours.'}),
      h('button',{type:'button',class:'btn block',text:'Restore this backup',onclick:function(){
        var clean={};keys.forEach(function(k){clean[k]=days[k];});
        mergeSettings(data);
        keys.forEach(function(k){state.days[k]=clean[k];});
        persistSettings();keys.forEach(persistDay);renderAll();box.remove();toast('Backup restored');
      }}));
    st.appendChild(box);
  }
  function askPass(obj){
    var pi=h('input',{type:'password',autocomplete:'off','aria-label':'Passcode for this backup'}),er=h('p',{class:'status',role:'alert'});
    var box=h('form',{class:'card stack',style:'box-shadow:none',onsubmit:async function(ev){
      ev.preventDefault();
      try{
        var raw=await unwrapWith(pi.value,obj.lock.pin);
        var data=await openJson(obj,await importDek(raw));
        box.remove();preview(obj,data);
      }catch(e){er.textContent='That passcode did not open this backup.';}
    }},h('p',{text:'This backup is encrypted. Enter the passcode that was active when you made it.'}),field('Backup passcode',pi),er,h('button',{type:'submit',class:'btn block',text:'Open backup'}));
    st.appendChild(box);
  }
  r.onload=async function(){
    try{
      var obj=JSON.parse(String(r.result));
      if(!obj||obj.app!=='daybook')throw new Error('format');
      if(obj.sealed){
        if(!cryptoOK||!obj.lock||!obj.lock.pin){bstat.textContent='This backup cannot be opened here.';return;}
        var done=false;
        if(dek){try{preview(obj,await openJson(obj,dek));done=true;}catch(e){}}
        if(!done)askPass(obj);
      }else preview(obj,obj.data||{});
    }catch(e){bstat.textContent='That file is not a Daybook backup.';}
  };
  r.onerror=function(){bstat.textContent='Could not read that file.';};
  r.readAsText(f);
}

function hideOnPermanentError(e){return e&&['not_granted','sampling_disabled','not_declared','capability_disabled'].indexOf(e.code)!==-1;}

applyTheme(getTheme());
setInterval(function(){renderNudge();},60000);
document.querySelector('.view[data-view="today"]').classList.add('on');

var remote=null;
function startApp(){renderAll();if(remote)loadRemote();}
async function loadRemote(){
  if(!remote||!unlocked)return;
  var snap=remote.snap;remote=null;
  var sawPlain=false,bad=0;
  try{
    if(snap&&snap.exists){
      var sd=snap.data();
      if(isSealed(sd)){try{mergeSettings(await openJson(sd,dek));}catch(e){bad++;}}
      else{sawPlain=true;mergeSettings(clone(sd));}
    }else writeSettings();
  }catch(e){}
  try{
    var all=await daysCol.get();
    for(var i=0;i<all.docs.length;i++){
      var ds=all.docs[i];if(!ds||!ds.id)continue;
      var dd=ds.data();if(!dd)continue;
      if(isSealed(dd)){try{state.days[ds.id]=await openJson(dd,dek);}catch(e){bad++;}}
      else{sawPlain=true;state.days[ds.id]=clone(dd);}
    }
  }catch(e){}
  if(lockMeta&&dek&&(sawPlain||metaDirty)){writeSettings();metaDirty=false;if(sawPlain)Object.keys(state.days).forEach(writeDay);}
  save();renderAll();
  if(bad)toast('Some entries in your account could not be opened with this passcode.');
}
async function initDb(){
  try{
    if(dbReady||!window.claude||!window.claude.use)return;
    var u=await window.claude.use('user'),d=await window.claude.use('db');
    if(!u||!d)return;
    var id=await u.id();if(!id)return;
    dbNS=d;
    settingsRef=dbNS.doc('data/users/'+id+'/tracker');daysCol=settingsRef.collection('days');
    var snap=await settingsRef.get();
    dbReady=true;remote={snap:snap};
    var rd=snap.exists?snap.data():null;
    if(rd&&rd.lock&&rd.lock.pin&&rd.lock.rec&&cryptoOK){
      if(!lockMeta||(!metaDirty&&!unlocked&&JSON.stringify(lockMeta)!==JSON.stringify(rd.lock))){
        var was=unlocked;
        lockMeta=clone(rd.lock);writeMeta();
        if(was){
          unlocked=false;dek=null;state=defaultState();
          var w=$('sheetWrap');w.classList.remove('open');w.hidden=true;$('sheetBody').innerHTML='';document.body.classList.remove('lock');sheetOpen=false;
          clearViews();showLock('App lock is on for your account. Enter your passcode.');
        }
      }
    }
    if(unlocked)loadRemote();
  }catch(e){}
}
(async function initDownloads(){
  try{if(window.claude&&window.claude.use)dlNS=await window.claude.use('downloads');}catch(e){dlNS=null;}
})();
if(unlocked)startApp();else showLock();
initDb();
(async function initSample(){
  try{
    if(!window.claude||!window.claude.use)return;
    var s=await window.claude.use('sample');if(!s)return;
    sampleNS=s;
    var lim=await s.limits().catch(function(){return null;});

    if(view==='insights')renderInsights();
  }catch(e){}
})();
})();
